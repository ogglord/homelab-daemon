# tygo config — generates frontend/src/types.gen.ts from pkg/api/*.go.
#
# Workflow (run from repo root):
#   go install github.com/gzuidhof/tygo@latest
#   tygo generate
#
# This file is intentionally minimal. tygo translates exported Go
# structs/consts in pkg/api/ into TypeScript interfaces/enums matching
# their JSON tags. Anonymous embedded structs are flattened.
packages:
  - path: "github.com/ogglord/homelab-api"
    output_path: "homelab-dash/frontend/src/types.gen.ts"
    indent: "  "
    frontmatter: |
      // Code generated by tygo from pkg/api/*.go. DO NOT EDIT.
      // Regenerate via: tygo generate (config: pkg/api/tygo.yaml)
    type_mappings:
      time.Time: "string /* RFC3339 */"
    fallback_type: "any"
