# tygo config — generates api-types/index.ts from pkg/api/*.go.
#
# Workflow (run from daemon repo root):
#   go install github.com/gzuidhof/tygo@latest
#   tygo generate
#
# The generated file is committed to the repo and consumed by the nixos
# frontend as a flake input dependency.
packages:
  - path: "github.com/ogglord/homelab-api"
    output_path: "../../api-types/index.ts"
    indent: "  "
    frontmatter: |
      // Code generated by tygo from pkg/api/*.go. DO NOT EDIT.
      // Regenerate via: tygo generate (config: pkg/api/tygo.yaml)
    type_mappings:
      time.Time: "string /* RFC3339 */"
    fallback_type: "any"
